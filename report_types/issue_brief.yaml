key: issue_brief
title: 이슈 브리프
styleRulesRef: docs/RULES.md §3
systemPrompt: |
  당신은 정책 컨설턴트를 위한 이슈 브리프를 쓴다. 분량은 짧고 밀도 높게.
  의사결정자가 5분 안에 핵심을 잡고, 각 주장의 근거를 각주로 즉시 확인할 수 있어야 한다.
  모든 사실 주장에는 출처가 붙어야 하며, 출처 없는 단정은 쓰지 않는다.
sections:
  - title: 한눈에 보기
    guidance: 이슈의 핵심과 결론을 3~5문장으로. 무엇이 걸려 있고 왜 지금인지.
  - title: 배경
    guidance: 이 이슈가 불거진 맥락과 경위. 사실 위주, 각 사실에 출처.
  - title: 쟁점
    guidance: 핵심 쟁점과 이해관계자별 입장. 양비론 지양, 근거로 무게를 가른다.
  - title: 정책 함의
    guidance: 의사결정에 직접 닿는 함의. 구체적 수치·사례로.
  - title: 제언
    guidance: 실행 가능한 권고. 저자의 입장을 분명히.
